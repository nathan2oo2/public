<style>
  /* FOOTER STYLES - Self-contained */
  :root {
    --footer-bg: #000;
    --footer-border: #111;
    --text-dim: #8e9399;
    --accent: #4da3ff;
  }

  .site-footer {
    background: var(--footer-bg);
    border-top: 1px solid var(--footer-border);
    margin-top: 3rem;
  }

  .footer-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0.875rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1.5rem;
  }

  .footer-left {
    flex: 1;
    min-width: 200px;
  }

  .footer-left p {
    color: var(--text-dim);
    font-size: 0.85rem;
    margin: 0;
  }

  .footer-right {
    display: flex;
    gap: 0.75rem;
    align-items: center;
  }

  .social-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 6px;
    background: #1a1a1a;
    text-decoration: none;
    transition: all 0.2s ease;
  }

  .social-link img {
    width: 20px;
    height: 20px;
    object-fit: contain;
    display: block;
  }

  .social-link:hover {
    box-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
  }

  @media (max-width: 768px) {
    .footer-container {
      padding: 0.875rem 1.25rem;
      flex-direction: column;
      gap: 1rem;
      text-align: center;
    }

    .footer-left {
      width: 100%;
      order: 1;
    }

    .footer-right {
      width: 100%;
      justify-content: center;
      order: 2;
    }
  }

  @media (max-width: 480px) {
    .footer-container {
      padding: 0.75rem 1rem;
      gap: 0.75rem;
    }

    .footer-left p {
      font-size: 0.8rem;
    }

    .footer-right {
      gap: 0.5rem;
    }

    .social-link {
      width: 28px;
      height: 28px;
    }

    .social-link img {
      width: 18px;
      height: 18px;
    }
  }
</style>

<footer class="site-footer">
  <div class="footer-container">
    <div class="footer-left">
      <p>© 2026 Nathan Baptista</p>
    </div>

    <div class="footer-right">
      <a href="https://youtube.com" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="YouTube" title="YouTube">
        <img data-icon="youtube.webp" alt="YouTube" loading="lazy">
      </a>

      <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="Instagram" title="Instagram">
        <img data-icon="instagram.webp" alt="Instagram" loading="lazy">
      </a>

      <a href="https://facebook.com" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="Facebook" title="Facebook">
        <img data-icon="facebook.webp" alt="Facebook" loading="lazy">
      </a>

      <a href="mailto:your-email@example.com" class="social-link" aria-label="Email" title="Email">
        <img data-icon="email.webp" alt="Email" loading="lazy">
      </a>
    </div>
  </div>
</footer>

<script>
  (function() {
    // Same root logic as the header: pages set <body data-root="..">
    var root = document.body.dataset.root || ".";
    var base = root === "." ? "images/" : root.replace(/\/+$/, "") + "/images/";

    document.querySelectorAll(".social-link img[data-icon]").forEach(function(img) {
      var name = img.getAttribute("data-icon");
      var tried = 0;
      var candidates = [base + name, "images/" + name, "../images/" + name, "../../images/" + name];

      img.onerror = function() {
        tried++;
        if (tried < candidates.length) img.src = candidates[tried];
      };
      img.src = candidates[0];
    });
  })();
</script>
