<style>
  /* FOOTER STYLES - Self-contained */
  :root {
    --footer-bg: #000;
    --footer-border: #111;
    --text-dim: #8e9399;
    --accent: #4da3ff;
  }

  .site-footer {
    background: var(--footer-bg);
    border-top: 1px solid var(--footer-border);
    margin-top: 3rem;
  }

  .footer-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0.875rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1.5rem;
  }

  .footer-left {
    flex: 1;
    min-width: 200px;
  }

  .footer-left p {
    color: var(--text-dim);
    font-size: 0.85rem;
    margin: 0;
  }

  .footer-right {
    display: flex;
    gap: 1.1rem;
    align-items: center;
  }

  .social-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    text-decoration: none;
    transition: color 0.2s ease, filter 0.2s ease;
  }

  .social-link svg {
    width: 24px;
    height: 24px;
    display: block;
  }

  .social-link:hover {
    color: #fff;
    filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.4));
  }

  @media (max-width: 768px) {
    .footer-container {
      padding: 0.875rem 1.25rem;
      flex-direction: column;
      gap: 1rem;
      text-align: center;
    }

    .footer-left {
      width: 100%;
      order: 1;
    }

    .footer-right {
      width: 100%;
      justify-content: center;
      order: 2;
    }
  }

  @media (max-width: 480px) {
    .footer-container {
      padding: 0.75rem 1rem;
      gap: 0.75rem;
    }

    .footer-left p {
      font-size: 0.8rem;
    }

    .footer-right {
      gap: 0.9rem;
    }

    .social-link svg {
      width: 22px;
      height: 22px;
    }
  }
</style>
