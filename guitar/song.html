<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Song</title>
<style>
  body { margin: 0; }
  .sg { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--sx-text); }
  .sg h1 { margin: 0; font-size: 1.5rem; }
  .sg .by { color: var(--sx-muted); margin: 2px 0 10px; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; }
  .meta span { padding: 3px 10px; border-radius: 999px; background: var(--sx-hover); font-size: .82rem; color: var(--sx-muted); }
  .meta b { color: var(--sx-text); font-weight: 600; }
  .links a { color: var(--sx-accent); margin-right: 12px; font-size: .9rem; }
  .bar { position: sticky; top: var(--sx-nav-h); z-index: 5; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 8px 0; margin: 12px 0; background: var(--sx-bg); border-bottom: 1px solid var(--sx-line); }
  .bar button { padding: 6px 10px; border-radius: 8px; border: 1px solid var(--sx-line); background: var(--sx-surface);
    color: var(--sx-text); font: inherit; font-size: .85rem; cursor: pointer; }
  .bar button.on { background: var(--sx-accent); color: var(--sx-bg); border-color: var(--sx-accent); }
  .bar .g { display: flex; align-items: center; gap: 4px; font-size: .85rem; color: var(--sx-muted); }
  .bar input[type=range] { width: 80px; accent-color: var(--sx-accent); }

  .sg { overflow-x: clip; }
  .sg h1, .sg .by, .sg p, .meta { overflow-wrap: anywhere; }
  .lay { display: flex; gap: 24px; align-items: flex-start; min-width: 0; }
  #song { order: 1; }
  #chords { order: 2; flex: none; display: grid; grid-template-columns: repeat(2, 84px); gap: 10px;
    position: sticky; top: calc(var(--sx-nav-h) + var(--bar-h, 56px) + 8px);
    max-height: calc(100vh - var(--sx-nav-h) - var(--bar-h, 56px) - 24px); overflow: auto; }
  #chords.many { grid-template-columns: repeat(3, 84px); }
  .cc { min-width: 0; text-align: center; font-size: .9rem; }
  .cc .ph { position: relative; aspect-ratio: 7 / 8; display: grid; place-items: center; border: 1px dashed var(--sx-line);
    border-radius: 8px; color: var(--sx-muted); font-size: .72rem; }
  .cc img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #fff; border-radius: 8px; }
  .cc b { display: block; margin-top: 4px; }
  .bar .m-only { display: none; }

  #song { flex: 1; min-width: 0; overflow-x: auto; margin: 0; white-space: pre; font-size: var(--fs, 15px); line-height: 1.5;
    font-family: ui-monospace, Menlo, Consolas, monospace; }
  .sec { margin: 18px 0 4px; color: var(--sx-muted); font-weight: 700; font-family: system-ui, sans-serif; }
  .ch { color: var(--sx-accent); font-weight: 700; }
  .hl .ch { --hlc: var(--sx-hover); background: var(--hlc); box-shadow: 0 0 0 2px var(--hlc); border-radius: 3px; }
  @supports (color: color-mix(in srgb, red, blue)) { .hl .ch { --hlc: color-mix(in srgb, var(--sx-accent) 30%, transparent); } }
  .nochords .cl { display: none; }
  @media (max-width: 768px) {
    .lay { flex-direction: column; align-items: stretch; gap: 12px; }
    #chords, #song { order: 0; }
    #song { flex: none; width: 100%; }
    #chords { display: flex; flex-wrap: wrap; gap: 8px; position: static; max-height: none; overflow: visible; }
    .cc { width: 84px; }
    #chords.fit { flex-wrap: nowrap; gap: 4px; }
    #chords.fit .cc { flex: 1 1 0; width: auto; max-width: 84px; font-size: .7rem; }
    #chords.pin { position: sticky; top: calc(var(--sx-nav-h) + var(--bar-h, 56px)); z-index: 4; background: var(--sx-bg);
      padding: 6px 0; max-height: 38vh; overflow-y: auto; border-bottom: 1px solid var(--sx-line); }
    .bar { flex-wrap: nowrap; overflow-x: auto; }
    .bar > * { flex: none; }
    .bar .m-only { display: inline-block; }
  }
</style>
</head>
<body data-nav="songbook">

<main class="sx-main sg" id="sx-main"><div id="app">Loading…</div></main>

<script src="shell.js"></script>
<script>
(function () {
  var id = new URLSearchParams(location.search).get('id');
  var S, tr = 0, fs = 15, spd = 3, timer = null, acc = 0;
  var N = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'], FL = { Db: 'C#', Eb: 'D#', Gb: 'F#', Ab: 'G#', Bb: 'A#' };
  var CH = /^[A-G][#b]?(maj|min|m|M|dim|aug|sus|add)?\d*(sus\d|add\d+)?(\/[A-G][#b]?)?$/;
  var $ = function (i) { return document.getElementById(i); };
  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function tc(c) {
    if (!tr) return c;
    return c.replace(/[A-G][#b]?/g, function (r) { var i = N.indexOf(FL[r] || r); return i < 0 ? r : N[(i + tr + 120) % 12]; });
  }
  function savedIds() { try { return JSON.parse(localStorage.getItem('sb-saved') || '[]'); } catch (e) { return []; } }

  function render() {
    var out = [], used = {};
    S.content.split('\n').forEach(function (L) {
      var m = L.trim().match(/^\[([^\]]+)\]$/);
      if (m && !CH.test(m[1])) { out.push('<div class="sec">' + esc(m[1]) + '</div>'); return; }
      var re = /\[([^\]]+)\]/g, x, last = 0, txt = '', cl = '', cv = 0, has = false;
      while ((x = re.exec(L))) {
        txt += L.slice(last, x.index); last = re.lastIndex;
        var c = tc(x[1]); used[c] = 1; has = true;
        var pad = Math.max(txt.length - cv, cv ? 1 : 0);
        cl += ' '.repeat(pad) + '<span class="ch">' + esc(c) + '</span>'; cv += pad + c.length;
      }
      txt += L.slice(last);
      if (has) out.push('<div class="cl">' + cl + '</div>');
      if (!has || txt.trim()) out.push('<div>' + (esc(txt) || ' ') + '</div>');
    });
    $('song').innerHTML = out.join('');
    $('chords').innerHTML = Object.keys(used).map(function (c) {
      return '<div class="cc"><div class="ph"><span>image</span><img src="chords/' + encodeURIComponent(c) + '.png" alt="" onerror="this.remove()"></div><b>' + esc(c) + '</b></div>';
    }).join('');
    $('chords').classList.toggle('many', Object.keys(used).length > 8);
    $('kv').textContent = tc(S.key || '—');
  }

  function stop() { clearInterval(timer); timer = null; $('scr').classList.remove('on'); $('scr').textContent = '▶ Scroll'; }
  function toggle(btn, el, cls) { btn.classList.toggle('on'); el.classList.toggle(cls); }

  function build() {
    document.title = S.title + ' · Songbook';
    var meta = [['Key', '<span id="kv"></span>'], ['Capo', S.capo], ['Tempo', S.tempo], ['Time', S.timeSignature], ['Tuning', S.tuning], ['Difficulty', S.difficulty]]
      .filter(function (a) { return a[1] !== '' && a[1] != null; })
      .map(function (a) { return '<span>' + a[0] + ' <b>' + (a[0] === 'Key' ? a[1] : esc(a[1])) + '</b></span>'; }).join('');
    var links = (S.youtubeLink ? '<a href="' + esc(S.youtubeLink) + '" target="_blank" rel="noopener">Watch on YouTube</a>' : '') +
      (S.youtubeTutorialLink ? '<a href="' + esc(S.youtubeTutorialLink) + '" target="_blank" rel="noopener">Tutorial</a>' : '');
    $('app').innerHTML =
      '<h1>' + esc(S.title) + '</h1><div class="by">' + esc(S.artist) + (S.releaseYear ? ' · ' + S.releaseYear : '') + '</div>' +
      '<div class="meta">' + meta + '</div>' + (S.description ? '<p style="color:var(--sx-muted);margin:6px 0">' + esc(S.description) + '</p>' : '') +
      '<div class="links">' + links + '</div>' +
      '<div class="bar" id="bar">' +
        '<span class="g">Key <button id="td">−</button><button id="tu">+</button></span>' +
        '<span class="g">Size <button id="fd">A−</button><button id="fu">A+</button></span>' +
        '<span class="g"><button id="scr">▶ Scroll</button><input id="spd" type="range" min="1" max="10" value="3" aria-label="Scroll speed"></span>' +
        '<button id="sv"></button>' +
      '</div>' +
      '<div class="lay" id="lay"><div id="chords"></div><div id="song"></div></div>';
    render();

    $('td').onclick = function () { tr = (tr + 11) % 12; render(); };
    $('tu').onclick = function () { tr = (tr + 1) % 12; render(); };
    $('fd').onclick = function () { fs = Math.max(10, fs - 1); $('song').style.setProperty('--fs', fs + 'px'); };
    $('fu').onclick = function () { fs = Math.min(34, fs + 1); $('song').style.setProperty('--fs', fs + 'px'); };
    $('spd').oninput = function () { spd = +this.value; };
    $('scr').onclick = function () {
      if (timer) return stop();
      this.classList.add('on'); this.textContent = '⏸ Scroll';
      timer = setInterval(function () {
        acc += spd * 12 * .05;
        if (acc >= 1) { var d = Math.floor(acc); acc -= d; window.scrollBy(0, d); }
        if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2) stop();
      }, 50);
    };
    function bh() { $('lay').style.setProperty('--bar-h', $('bar').offsetHeight + 'px'); }
    bh(); window.addEventListener('resize', bh);
    SiteShell.addSetting({ id: 'chords', label: 'Show chords', def: true, on: function (v) { $('song').classList.toggle('nochords', !v); } });
    SiteShell.addSetting({ id: 'hl', label: 'Highlight chords', def: false, on: function (v) { $('song').classList.toggle('hl', v); } });
    SiteShell.addSetting({ id: 'pin', label: 'Pin chord images', def: false, mobile: true, on: function (v) { $('chords').classList.toggle('pin', v); } });
    SiteShell.addSetting({ id: 'fit', label: 'Chord images on one line', def: false, mobile: true, on: function (v) { $('chords').classList.toggle('fit', v); } });
    function sv() { $('sv').textContent = savedIds().indexOf(S.id) < 0 ? '♡ Save' : '♥ Saved'; $('sv').classList.toggle('on', savedIds().indexOf(S.id) >= 0); }
    $('sv').onclick = function () {
      var a = savedIds(), i = a.indexOf(S.id); if (i < 0) a.push(S.id); else a.splice(i, 1);
      try { localStorage.setItem('sb-saved', JSON.stringify(a)); } catch (e) {}
      sv(); SiteShell.refresh();
    };
    sv();
  }

  if (window.SiteShell) SiteShell.el.addEventListener('sx:search', function (e) { location.href = 'index.html?q=' + encodeURIComponent(e.detail.query); });

  fetch(new URL('songs1.json', location.href).href, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status + ' for ' + r.url); return r.text(); }).then(function (t) { var d; try { d = JSON.parse(t); } catch (e) { throw new Error('songs1.json is not valid JSON (' + e.message + ')'); } if (!Array.isArray(d)) throw new Error('songs1.json must be an array of songs'); return d; }).then(function (d) {
    S = d.filter(function (s) { return s.id === id; })[0];
    if (!S) { $('app').innerHTML = 'Song not found. <a href="index.html" style="color:var(--sx-accent)">Back to the songbook</a>'; return; }
    build();
  }).catch(function (e) { $('app').textContent = 'Could not load songs: ' + e.message; });
})();
</script>
</body>
</html>
