
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mogachem Goem</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Georgia,"Times New Roman",serif}
body{
  background:
    radial-gradient(circle at 20% 15%,rgba(255,255,255,.12),transparent 22%),
    radial-gradient(circle at 80% 70%,rgba(0,0,0,.15),transparent 30%),
    linear-gradient(135deg,#8d5c35,#b17b4b 45%,#704526);
  color:#26170e;
  overflow-x:hidden;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;
  background-image:repeating-linear-gradient(4deg,transparent 0 7px,rgba(50,25,10,.12) 8px,transparent 10px);
  mix-blend-mode:multiply;
}
.page{
  min-height:100vh;
  padding:5vh 5vw;
  position:relative;
}

/* Back Button Styling */
.back-btn {
  position: absolute;
  top: 24px;
  left: 24px;
  z-index: 50;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: #f1dfb5;
  color: #26170e;
  text-decoration: none;
  padding: 9px 18px;
  border-radius: 4px;
  border: 1px solid rgba(65,38,15,.35);
  box-shadow: 2px 4px 10px rgba(30,15,5,.25);
  font-size: .85rem;
  letter-spacing: .14em;
  text-transform: uppercase;
  font-family: Georgia, "Times New Roman", serif;
  transition: transform .25s ease, background-color .25s ease, box-shadow .25s ease;
  user-select: none;
  cursor: pointer;
}
.back-btn:hover {
  background: #ead9ad;
  transform: translateY(-2px);
  box-shadow: 3px 6px 14px rgba(30,15,5,.35);
}
.back-btn:active {
  transform: translateY(0);
}
.back-arrow {
  font-size: 1.1em;
  line-height: 1;
}

.intro{
  position:absolute;
  left:50%;top:50%;
  transform:translate(-50%,-50%) rotate(-1deg);
  width:min(390px,82vw);
  padding:34px 34px 38px;
  background:#ead9ad;
  box-shadow:0 18px 30px rgba(30,15,5,.32);
  text-align:center;
  z-index:5;
}
.intro:before{
  content:"";position:absolute;inset:10px;
  border:1px solid rgba(65,38,15,.35);pointer-events:none;
}
.intro h1{
  margin:0 0 8px;
  font-size:clamp(2.3rem,5vw,4.4rem);
  letter-spacing:.08em;
  line-height:.95;
  text-transform:uppercase;
}
.intro .rule{width:70px;height:2px;background:#8c542b;margin:18px auto}
.intro p{font-size:1.05rem;line-height:1.6;margin:0}
.intro small{display:block;margin-top:18px;letter-spacing:.15em;text-transform:uppercase;opacity:.65}

.object{
  position:absolute;
  display:block;
  text-decoration:none;
  color:inherit;
  cursor:pointer;
  transition:transform .35s ease,filter .35s ease;
  filter:drop-shadow(0 20px 15px rgba(30,15,5,.35));
  user-select:none;
}
.object:hover{filter:drop-shadow(0 25px 20px rgba(30,15,5,.45));z-index:10}

.img-frame{
  background:#f2e7cc;
  padding:10px 10px 12px;
  border-radius:4px;
  box-shadow:0 8px 16px rgba(0,0,0,.25);
  overflow:hidden;
}
.img-frame img{
  display:block;
  width:100%;
  height:auto;
  object-fit:cover;
  border-radius:2px;
  filter:sepia(.25) contrast(1.05) brightness(.95);
  transition:filter .35s ease;
}
.object:hover .img-frame img{
  filter:sepia(.1) contrast(1.08) brightness(1);
}

.label{
  position:absolute;
  background:#f1dfb5;
  padding:7px 13px;
  box-shadow:3px 5px 8px rgba(30,15,5,.25);
  font-size:.85rem;
  letter-spacing:.14em;
  text-transform:uppercase;
  white-space:nowrap;
  z-index:3;
}

/* =========================================================
   PLAIN IMAGE RECORD PLAYER COMPONENT STYLES
   ========================================================= */
.record-player {
  left: 6%;
  top: 8%;
  width: 330px;
  aspect-ratio: 1.25 / 1;
  transform: rotate(-7deg);
  outline: none;
  position: absolute;
}
.record-player:hover {
  transform: rotate(-7deg) scale(1.04);
}
.record-player:focus-visible {
  outline: 2px solid #dfc48b;
  outline-offset: 6px;
  border-radius: 8px;
}

/* Player Enclosure Outer Wrapper */
.player-container {
  position: relative;
  width: 100%;
  height: 100%;
}

/* Image Layer 1: Base Player Image */
.player-base-img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

/* Platter & Vinyl Overlay Container */
.platter-area {
  position: absolute;
  width: 68%;
  aspect-ratio: 1 / 1;
  left: 9%;
  top: 10%;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* Image Layer 2: Vinyl Record Image (Spins) */
.vinyl-img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
  border-radius: 50%;
  transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

.is-playing .vinyl-img {
  animation: spin-record 2.2s linear infinite;
}

@keyframes spin-record {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* Image Layer 3: Shine Overlay Image (Oscillates) */
.shine-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  pointer-events: none;
  mix-blend-mode: overlay;
  opacity: 0.75;
  transform: rotate(0deg);
  transition: opacity 0.4s ease;
}

.is-playing .shine-img {
  animation: oscillate-shine 3.8s ease-in-out infinite alternate;
}

@keyframes oscillate-shine {
  0% {
    transform: rotate(-15deg) scale(1);
    opacity: 0.65;
  }
  50% {
    transform: rotate(20deg) scale(1.02);
    opacity: 0.95;
  }
  100% {
    transform: rotate(-8deg) scale(0.98);
    opacity: 0.7;
  }
}

/* Image Layer 4: Tone Arm Assembly (Swings & Wobbles) */
.tonearm-assembly {
  position: absolute;
  right: 5%;
  top: 5%;
  width: 32%;
  height: 72%;
  pointer-events: none;
  transform-origin: 75% 15%; /* Pivot anchor for swinging tone arm image */
  transform: rotate(-35deg);
  transition: transform 0.85s cubic-bezier(0.34, 1.25, 0.64, 1);
  z-index: 4;
}

.is-playing .tonearm-assembly {
  transform: rotate(5deg);
}

.tonearm-wobbler {
  width: 100%;
  height: 100%;
}

.is-playing .tonearm-wobbler {
  animation: tonearm-wobble 1.6s ease-in-out infinite alternate;
}

@keyframes tonearm-wobble {
  0% { transform: rotate(0deg) translateY(0px); }
  25% { transform: rotate(0.6deg) translateY(0.4px); }
  50% { transform: rotate(-0.5deg) translateY(-0.3px); }
  75% { transform: rotate(0.7deg) translateY(0.5px); }
  100% { transform: rotate(-0.4deg) translateY(0px); }
}

.tonearm-img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

/* Player Accents & Controls */
.turntable-controls {
  position: absolute;
  bottom: 10px;
  right: 12px;
  display: flex;
  align-items: center;
  gap: 7px;
  z-index: 5;
}

.power-indicator {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #442211;
  border: 1px solid #221105;
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.8);
  transition: background 0.3s, box-shadow 0.3s;
}

.is-playing .power-indicator {
  background: #55ff55;
  box-shadow: 0 0 8px #44ff44, inset 0 1px 2px #ffffff;
}

.status-badge {
  font-family: monospace, sans-serif;
  font-size: 0.62rem;
  font-weight: bold;
  letter-spacing: 0.08em;
  color: #8c6a46;
  background: rgba(10, 5, 2, 0.75);
  padding: 3px 7px;
  border-radius: 4px;
  border: 1px solid rgba(140, 106, 70, 0.35);
  transition: color 0.3s, border-color 0.3s;
}

.is-playing .status-badge {
  color: #e6c885;
  border-color: #d4af37;
}

.record-player .label {
  bottom: -15px;
  left: 25px;
}

/* Other Objects */
.tv{right:5%;top:8%;width:310px;transform:rotate(5deg)}
.tv:hover{transform:rotate(5deg) scale(1.04)}
.tv .img-frame img{aspect-ratio:4/3}
.tv .label{right:10px;bottom:-15px}

.camera{left:9%;bottom:8%;width:280px;transform:rotate(9deg)}
.camera:hover{transform:rotate(9deg) scale(1.04)}
.camera .img-frame img{aspect-ratio:4/3}
.camera .label{bottom:-18px;left:30px}

.plate{right:9%;bottom:8%;width:290px;transform:rotate(-6deg)}
.plate:hover{transform:rotate(-6deg) scale(1.04)}
.plate .img-frame img{aspect-ratio:1/1;border-radius:50%;}
.plate .label{right:15px;bottom:-18px}

.photos{right:30%;bottom:5%;width:300px;display:flex;gap:10px;transform:rotate(3deg);z-index:2}
.photo-polaroid{
  width:140px;
  background:#f2e7cc;
  padding:10px 10px 32px;
  box-shadow:4px 8px 14px rgba(30,15,5,.3);
  position:relative;
}
.photo-polaroid img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  filter:sepia(.3) contrast(1.05);
}
.photo-polaroid:nth-child(1){transform:rotate(-9deg);background:#e7d5ad}
.photo-polaroid:nth-child(2){transform:rotate(8deg);margin-top:15px}
.photos .label{bottom:-20px;right:20px}

@media(max-width:800px){
  .page{padding:0 0 40px;min-height:auto}
  .back-btn {
    top: 16px;
    left: 16px;
    padding: 7px 14px;
    font-size: .78rem;
  }
  .intro{
    position:relative;left:auto;top:auto;transform:rotate(-1deg);
    margin:0 auto 70px;width:min(410px,88vw);
  }
  .object{
    position:relative!important;
    left:auto!important;right:auto!important;top:auto!important;bottom:auto!important;
    margin:75px auto;width:min(86vw,310px);
  }
  .record-player{transform:rotate(-4deg)}
  .record-player:hover{transform:rotate(-4deg) scale(1.03)}
  .tv{transform:rotate(3deg)}
  .tv:hover{transform:rotate(3deg) scale(1.03)}
  .camera{transform:rotate(5deg)}
  .camera:hover{transform:rotate(5deg) scale(1.03)}
  .plate{transform:rotate(-4deg)}
  .plate:hover{transform:rotate(-4deg) scale(1.03)}
  .photos{transform:rotate(2deg);width:min(86vw,300px);justify-content:center}
  .photos:hover{transform:rotate(2deg) scale(1.03)}
  .intro p{font-size:.98rem}
}
</style>
</head>
<body>
<main class="page">

  <!-- TOPMOST BACK BUTTON -->
  <a href="javascript:history.back()" class="back-btn" aria-label="Go Back">
    <span class="back-arrow" aria-hidden="true">←</span> Back
  </a>

  <section class="intro">
    <h1>Mogachem<br>Goem</h1>
    <div class="rule"></div>
    <p>A collection of the places, sounds, images and flavours that tell the story of Goa.</p>
    <small>Explore · Remember · Share</small>
  </section>

  <!-- RECORD PLAYER (ALL IMAGE LAYERS) -->
  <div class="object record-player" id="record-player" role="button" tabindex="0" aria-label="Music Record Player - Tap to Start or Stop" aria-pressed="false" onclick="toggleRecordPlayer()" onkeydown="handleKeyDown(event)">
    <div class="player-container">
      
      <!-- IMAGE LAYER 1: Player / Turntable Base -->
      <img src="player-base.png" class="player-base-img" alt="Turntable Base" onerror="this.onerror=null;this.src='https://placehold.co/600x480/3d2516/f2e7cc?text=Player+Base+PNG';">

      <!-- Platter / Record Container -->
      <div class="platter-area">
        <!-- IMAGE LAYER 2: Vinyl Record Image (Spins) -->
        <img src="https://ibb.co/nMb3jJHv" class="vinyl-img" alt="Vinyl Record" onerror="this.onerror=null;this.src='https://ibb.co/nMb3jJHv';">

        <!-- IMAGE LAYER 3: Shine Overlay Image (Oscillates) -->
        <img src="record-shine.png" class="shine-img" alt="Record Shine Overlay" onerror="this.onerror=null;this.src='https://placehold.co/500x500/transparent/ffffff?text=Shine+Overlay+PNG';">
      </div>

      <!-- IMAGE LAYER 4: Tone Arm Assembly (Swings & Wobbles) -->
      <div class="tonearm-assembly">
        <div class="tonearm-wobbler">
          <img src="tonearm.png" class="tonearm-img" alt="Tone Arm" onerror="this.onerror=null;this.src='https://placehold.co/150x300/transparent/d4af37?text=Tone+Arm+PNG';">
        </div>
      </div>

      <!-- Controls & Status LED -->
      <div class="turntable-controls">
        <span class="power-indicator" id="power-led"></span>
        <span class="status-badge" id="status-badge">TAP TO PLAY</span>
      </div>

    </div>
    <div class="label">Music</div>
  </div>

  <a class="object tv" href="#videos" aria-label="Videos">
    <div class="img-frame">
      <img src="https://images.unsplash.com/photo-1593305841991-05c297ba4575?auto=format&fit=crop&w=600&q=80" alt="Videos - Retro Television" onerror="this.onerror=null;this.src='https://placehold.co/600x450/6e4325/f4e9c9?text=Videos+TV';">
    </div>
    <div class="label">Videos</div>
  </a>

  <a class="object camera" href="#photos" aria-label="Photos">
    <div class="img-frame">
      <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?auto=format&fit=crop&w=600&q=80" alt="Photos - Vintage Camera" onerror="this.onerror=null;this.src='https://placehold.co/600x450/6e4325/f4e9c9?text=Vintage+Camera';">
    </div>
    <div class="label">Photos</div>
  </a>

  <a class="object plate" href="#food" aria-label="Food">
    <div class="img-frame">
      <img src="https://images.unsplash.com/photo-1631452180519-c014fe946bc7?auto=format&fit=crop&w=600&q=80" alt="Food - Goan Cuisine" onerror="this.onerror=null;this.src='https://placehold.co/600x600/6e4325/f4e9c9?text=Goan+Food';">
    </div>
    <div class="label">Food</div>
  </a>

  <a class="object photos" href="#places" aria-label="Places">
    <div class="photo-polaroid">
      <img src="https://images.unsplash.com/photo-1512343879784-a960bf40e7f2?auto=format&fit=crop&w=600&q=80" alt="Places - Goa Beach" onerror="this.onerror=null;this.src='https://placehold.co/500x500/6e4325/f4e9c9?text=Goa+Beach';">
    </div>
    <div class="photo-polaroid">
      <img src="https://images.unsplash.com/photo-1587922546307-776227941871?auto=format&fit=crop&w=600&q=80" alt="Places - Goa Palms" onerror="this.onerror=null;this.src='https://placehold.co/500x500/6e4325/f4e9c9?text=Goa+Palms';">
    </div>
    <div class="label">Places</div>
  </a>

</main>

<script>
let audioCtx = null;
let isPlaying = false;
let activeNodes = [];
let noteTimer = null;

function toggleRecordPlayer() {
  const player = document.getElementById('record-player');
  const badge = document.getElementById('status-badge');
  isPlaying = !isPlaying;

  if (isPlaying) {
    player.classList.add('is-playing');
    player.setAttribute('aria-pressed', 'true');
    badge.textContent = 'PLAYING ♫';
    startAudioSynthesis();
  } else {
    player.classList.remove('is-playing');
    player.setAttribute('aria-pressed', 'false');
    badge.textContent = 'TAP TO PLAY';
    stopAudioSynthesis();
  }
}

function handleKeyDown(e) {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    toggleRecordPlayer();
  }
}

function startAudioSynthesis() {
  try {
    if (!audioCtx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }

    // Master Volume Gain with gentle fade-in
    const masterGain = audioCtx.createGain();
    masterGain.gain.setValueAtTime(0.001, audioCtx.currentTime);
    masterGain.gain.exponentialRampToValueAtTime(0.18, audioCtx.currentTime + 0.8);
    masterGain.connect(audioCtx.destination);
    activeNodes.push(masterGain);

    // 1. Analog Vinyl Crackle Generator
    const bufferSize = audioCtx.sampleRate * 2;
    const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const output = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      const isPop = Math.random() < 0.0015;
      output[i] = isPop ? (Math.random() * 2 - 1) * 0.8 : (Math.random() * 2 - 1) * 0.03;
    }

    const crackleSource = audioCtx.createBufferSource();
    crackleSource.buffer = noiseBuffer;
    crackleSource.loop = true;

    const crackleFilter = audioCtx.createBiquadFilter();
    crackleFilter.type = 'bandpass';
    crackleFilter.frequency.value = 1800;
    crackleFilter.Q.value = 0.8;

    crackleSource.connect(crackleFilter);
    crackleFilter.connect(masterGain);
    crackleSource.start();
    activeNodes.push(crackleSource);

    // 2. Retro Melody Loop
    const notes = [
      261.63, 329.63, 392.00, 440.00, 392.00, 329.63,
      293.66, 349.23, 440.00, 523.25, 440.00, 349.23
    ];
    
    let step = 0;
    noteTimer = setInterval(() => {
      if (!isPlaying || !audioCtx) return;
      
      const osc = audioCtx.createOscillator();
      const noteGain = audioCtx.createGain();
      
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(notes[step % notes.length], audioCtx.currentTime);

      noteGain.gain.setValueAtTime(0, audioCtx.currentTime);
      noteGain.gain.linearRampToValueAtTime(0.12, audioCtx.currentTime + 0.08);
      noteGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);

      osc.connect(noteGain);
      noteGain.connect(masterGain);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.65);
      
      step++;
    }, 450);

  } catch(e) {
    console.log('Audio init prevented:', e);
  }
}

function stopAudioSynthesis() {
  if (noteTimer) {
    clearInterval(noteTimer);
    noteTimer = null;
  }
  activeNodes.forEach(node => {
    try {
      if (node.gain) {
        node.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + 0.3);
      } else if (node.stop) {
        node.stop(audioCtx.currentTime + 0.35);
      }
    } catch(e){}
  });
  activeNodes = [];
}
</script>

</body>
</html>
