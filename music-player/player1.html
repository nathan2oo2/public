<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YouTube Music Clone - Fully Optimized</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />
    <style>
        /* YT Music Theme Variables */
        :root {
            --bg-color: #030303;
            --surface-color: #212121;
            --surface-hover: #383838;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --sidebar-width: 240px;
            --player-width: 340px;
            --yt-red: #ff0000;
            --focus-color: #ffffff;
            --border-color: rgba(255,255,255,0.1);
        }

        body.theme-light {
            --bg-color: #f5f5f5;
            --surface-color: #ffffff;
            --surface-hover: #e8e8e8;
            --text-primary: #121212;
            --text-secondary: #5f5f5f;
            --focus-color: #212121;
            --border-color: rgba(0,0,0,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-primary); overflow: hidden; display: flex; height: 100vh; width: 100vw; transition: background-color 0.25s ease, color 0.25s ease; }

        /* Spatial Navigation Focus States (Desktop/TV) */
        .focusable { outline: none; transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.2s cubic-bezier(0.2, 0, 0, 1), background-color 0.2s ease; }
        .focusable:focus-visible { box-shadow: 0 0 0 3px var(--focus-color); transform: scale(1.05); z-index: 10; }
        .nav-link.focusable:focus-visible, .search-bar.focusable:focus-visible { transform: scale(1.02); box-shadow: 0 0 0 2px var(--focus-color); }
        .card.focusable:focus-visible { box-shadow: none; transform: scale(1.05); }
        .card.focusable:focus-visible .card-img-wrapper { box-shadow: 0 0 0 3px var(--focus-color); }
        #volumeWrapper.focusable:focus-visible, #progressWrapper.focusable:focus-visible { transform: scale(1); box-shadow: 0 0 0 2px var(--yt-red); }

        h1, h2, h3 { font-weight: 700; }
        .text-sub { color: var(--text-secondary); font-size: 14px; margin-top: 4px; font-weight: 400; line-height: 1.4;}
        .material-symbols-rounded { font-size: 24px; user-select: none; }

        /* 1. LEFT NAVIGATION SIDEBAR */
        .nav-sidebar { width: var(--sidebar-width); background-color: var(--bg-color); display: flex; flex-direction: column; padding: 16px 8px; flex-shrink: 0; border-right: 1px solid var(--border-color); }
        .logo { display: flex; align-items: center; padding: 12px 16px 24px; font-size: 22px; font-weight: 700; gap: 4px; letter-spacing: -0.5px; }
        .logo .material-symbols-rounded { color: var(--yt-red); font-size: 32px; font-variation-settings: 'FILL' 1; }
        .nav-links { list-style: none; display: flex; flex-direction: column; gap: 4px; }
        .nav-link { display: flex; align-items: center; padding: 12px 16px; gap: 16px; color: var(--text-secondary); cursor: pointer; font-weight: 500; font-size: 15px; border-radius: 8px; }
        .nav-link:hover { color: var(--text-primary); }
        .nav-link.active { color: var(--text-primary); background-color: rgba(255,255,255,0.05);}
        .nav-link.active .material-symbols-rounded { font-variation-settings: 'FILL' 1; }

        /* 2. MAIN CONTENT AREA */
        .main-content { flex: 1; overflow-y: auto; position: relative; -webkit-overflow-scrolling: touch; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: rgba(3,3,3,0.9); backdrop-filter: blur(10px); padding: 12px 32px; z-index: 10; }
        body.theme-light .top-bar { background: rgba(245,245,245,0.92); }
        .search-bar { display: flex; align-items: center; background-color: var(--surface-color); padding: 8px 16px; border-radius: 24px; width: 100%; max-width: 480px; gap: 12px; border: 1px solid transparent; }
        .search-bar:focus-within { border-color: #555; background-color: var(--bg-color); }
        .search-bar input { background: transparent; border: none; color: white; outline: none; width: 100%; font-size: 16px; font-weight: 400; }
        .profile-icon { flex-shrink: 0; width: 36px; height: 36px; border-radius: 50%; background-color: #00bcd4; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: 500; font-size: 14px; }

        .view-content { display: none; padding: 0 32px 32px 32px; animation: fadeIn 0.3s ease; }
        .view-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Greetings & Mood Pills (Mobile Touch Scroll Optimized) */
        .greeting-header { font-size: 36px; font-weight: 900; letter-spacing: -1px; margin: 24px 0 16px 0; }
        .mood-container { display: flex; gap: 12px; margin-bottom: 32px; overflow-x: auto; padding: 6px 4px 12px 4px; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
        .mood-container::-webkit-scrollbar { display: none; }
        .mood-pill { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 10px 20px; border-radius: 24px; font-size: 15px; font-weight: 500; cursor: pointer; white-space: nowrap; scroll-snap-align: start;}

        .section-title { margin-bottom: 20px; font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 24px 20px; margin-bottom: 48px; }
        .card { display: flex; flex-direction: column; cursor: pointer; border-radius: 8px; }
        .card-img-wrapper { position: relative; width: 100%; aspect-ratio: 1; margin-bottom: 12px; border-radius: 8px; overflow: hidden; }
        .card-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
        .play-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s; }
        .card:hover .play-overlay { opacity: 1; }
        .play-overlay .play-circle { width: 48px; height: 48px; background: rgba(0,0,0,0.8); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; transition: transform 0.2s; }
        .card:hover .play-circle { transform: scale(1.1); }
        .play-circle .material-symbols-rounded { font-size: 32px; font-variation-settings: 'FILL' 1; }
        .now-playing-title { font-weight: 700; font-size: 15px; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .radio-meta { color: var(--text-secondary); font-size: 13px; margin-top: 4px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-weight: 400; }

        .home-scroll { display: flex; gap: 16px; overflow-x: auto; padding: 4px 4px 16px 4px; margin-bottom: 32px; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
        .home-scroll::-webkit-scrollbar { display: none; }
        .home-scroll .card { min-width: 160px; max-width: 180px; flex: 0 0 auto; scroll-snap-align: start; }

        .artist-strip { display: flex; gap: 20px; overflow-x: auto; padding: 8px 4px 24px 4px; margin-bottom: 32px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
        .artist-strip::-webkit-scrollbar { display: none; }
        .artist-chip { flex: 0 0 auto; width: 96px; text-align: center; cursor: pointer; }
        .artist-chip.focusable:focus-visible .artist-avatar { box-shadow: 0 0 0 3px var(--focus-color); }
        .artist-avatar { width: 88px; height: 88px; border-radius: 50%; margin: 0 auto 10px; overflow: hidden; background: var(--surface-color); border: 2px solid var(--border-color); }
        .artist-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .artist-name { font-size: 13px; font-weight: 600; color: var(--text-primary); line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        .search-results { display: none; margin: 0 32px 16px; background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 12px; max-height: 50vh; overflow-y: auto; z-index: 20; position: relative; }
        .search-results.active { display: block; }
        .search-result-row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; cursor: pointer; border-bottom: 1px solid var(--border-color); }
        .search-result-row:last-child { border-bottom: none; }
        .search-result-row:hover, .search-result-row:focus { background: var(--surface-hover); outline: none; }
        .search-result-row img { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; flex-shrink: 0; background: var(--surface-hover); }
        .search-result-meta { min-width: 0; }
        .search-result-title { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .search-result-sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

        .settings-panel { max-width: 480px; display: flex; flex-direction: column; gap: 20px; }
        .settings-field label { display: block; font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; }
        .settings-field input[type="text"] { width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--surface-color); color: var(--text-primary); font-size: 16px; }
        .theme-toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px; border-radius: 12px; background: var(--surface-color); border: 1px solid var(--border-color); }
        .theme-toggle-row span { font-weight: 600; }

        .control-btn.active-mode { color: var(--yt-red); }
        body.theme-light .control-btn.active-mode { color: #c40000; }

        .player-panel.radio-mode .hide-for-radio { display: none !important; }
        .volume-bar-wrapper { touch-action: none; min-height: 44px; align-items: center; }
        @media (min-width: 851px) {
            .volume-bar-wrapper { min-height: 28px; }
        }

        /* 3. RIGHT PLAYER SIDEBAR (Desktop Base) */
        .player-panel { width: var(--player-width); background-color: var(--bg-color); display: flex; flex-direction: column; align-items: center; padding: 32px 24px 24px 24px; border-left: 1px solid var(--border-color); flex-shrink: 0; z-index: 1000; transition: transform 0.3s cubic-bezier(0.2, 0, 0, 1), height 0.3s cubic-bezier(0.2, 0, 0, 1); }

        /* Hidden mobile toggle button */
        .close-player-btn { display: none; position: absolute; top: 16px; left: 16px; background: transparent; border: none; color: white; padding: 12px; cursor: pointer; border-radius: 50%; }

        .player-info-container { display: flex; flex-direction: column; width: 100%; margin-bottom: 24px; }
        .now-playing-img { width: 100%; aspect-ratio: 1; border-radius: 8px; object-fit: cover; margin-bottom: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.5);}
        .track-metadata { display: flex; flex-direction: column; width: 100%; text-align: left; overflow: hidden; }
        .player-title { font-weight: 800; font-size: 24px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2;}
        .player-artist { font-size: 16px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .yt-action-btns { display: flex; gap: 8px; margin-top: 20px; width: 100%; justify-content: space-between;}
        .action-btn { background: transparent; border: none; color: var(--text-primary); cursor: pointer; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center;}
        .action-btn .material-symbols-rounded { font-size: 24px; }

        .progress-container { display: flex; align-items: center; width: 100%; gap: 12px; font-size: 12px; color: var(--text-secondary); margin-bottom: 24px; font-weight: 500;}
        .progress-bar-wrapper { flex: 1; height: 24px; display: flex; align-items: center; cursor: pointer; border-radius: 4px; }
        .progress-bar { width: 100%; height: 3px; background-color: rgba(255,255,255,0.2); position: relative; border-radius: 2px;}
        .progress-fill { height: 100%; background-color: var(--yt-red); width: 0%; position: relative; border-radius: 2px;}
        .progress-fill::after { content: ''; position: absolute; right: -6px; top: -4.5px; width: 12px; height: 12px; background-color: var(--yt-red); border-radius: 50%; opacity: 0; transition: opacity 0.2s; }
        .progress-bar-wrapper:hover .progress-fill::after { opacity: 1; }

        .player-controls { display: flex; align-items: center; gap: 12px; width: 100%; justify-content: center; }
        .control-btn { flex-shrink: 0; background: transparent; border: none; color: var(--text-primary); cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 50%; width: 48px; height: 48px; }
        .play-btn { background-color: var(--text-primary); color: var(--bg-color); width: 68px; height: 68px; }
        .play-btn .material-symbols-rounded { font-size: 40px; font-variation-settings: 'FILL' 1; }

        .volume-container { display: flex; align-items: center; width: 100%; gap: 12px; margin-top: auto; padding-top: 20px; }
        .volume-bar-wrapper { flex: 1; height: 20px; display: flex; align-items: center; cursor: pointer; border-radius: 4px;}
        .volume-bar { width: 100%; height: 3px; background-color: rgba(255,255,255,0.2); border-radius: 2px;}
        .volume-fill { height: 100%; background-color: var(--text-primary); width: 100%; transition: width 0.1s; border-radius: 2px;}

        /* 4. MOBILE BOTTOM NAV */
        .mobile-nav { display: none; position: fixed; bottom: 0; left: 0; width: 100%; background-color: var(--surface-color); z-index: 100; border-top: 1px solid #000; padding-bottom: env(safe-area-inset-bottom); }
        .mobile-nav-list { display: flex; justify-content: space-around; list-style: none; padding: 6px 0; margin: 0; }
        .mobile-nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-secondary); font-size: 11px; gap: 4px; cursor: pointer; border-radius: 4px; padding: 4px 12px; font-weight: 500;}
        .mobile-nav-item.active { color: var(--text-primary); }
        .mobile-nav-item.active .material-symbols-rounded { font-variation-settings: 'FILL' 1; }

        /* =========================================
           MOBILE & TABLET RESPONSIVE RULES
           ========================================= */
        @media (max-width: 850px) {
            .nav-sidebar { display: none; }
            .mobile-nav { display: block; }
            .view-content { padding: 16px 16px 120px 16px; }
            .top-bar { padding: 12px 16px; }
            .search-results { margin: 0 16px 12px; }
            .grid-container { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px; }
            .greeting-header { font-size: 28px; }

            /* * MINI-PLAYER STATE (Default on Mobile) */
            .player-panel {
                position: fixed;
                bottom: calc(54px + env(safe-area-inset-bottom));
                left: 0; width: 100%; height: 60px;
                flex-direction: row; padding: 0 16px; justify-content: space-between;
                border-left: none; background: var(--surface-hover);
                cursor: pointer; border-radius: 8px 8px 0 0;
            }
            .player-info-container { flex-direction: row; align-items: center; margin-bottom: 0; flex: 1; overflow: hidden; pointer-events: none; }
            .now-playing-img { width: 44px; height: 44px; margin-bottom: 0; margin-right: 12px; border-radius: 4px; box-shadow: none; pointer-events: none; }
            .track-metadata { justify-content: center; pointer-events: none; }
            .player-title { font-size: 15px; margin-bottom: 2px; }
            .player-artist { font-size: 13px; }

            .player-controls { margin-bottom: 0; width: auto; gap: 4px; justify-content: flex-end; }
            .play-btn { width: 44px; height: 44px; background: transparent; color: var(--text-primary); }
            .play-btn .material-symbols-rounded { font-size: 34px; }
            .control-btn { width: 40px; height: 40px; }

            /* Hide full-screen elements in mini mode */
            .hide-on-mobile, .yt-action-btns, .volume-container { display: none; }

            /* Mini Progress Bar hugging the bottom edge */
            .progress-container { position: absolute; bottom: 0; left: 0; width: 100%; height: 2px; margin: 0; gap: 0; pointer-events: none;}
            .progress-bar-wrapper { height: 2px; border-radius: 0; }
            .progress-bar { height: 2px; border-radius: 0; background: rgba(255,255,255,0.1); }
            .progress-fill { border-radius: 0; }
            #currentTimeDisplay, #durationDisplay, .progress-fill::after { display: none; }

            /* * FULL-SCREEN PLAYER STATE */
            .player-panel.fullscreen {
                height: 100dvh; bottom: 0; padding: 48px 24px;
                flex-direction: column; justify-content: flex-start;
                background: var(--bg-color); cursor: default; border-radius: 0;
            }
            .player-panel.fullscreen .close-player-btn { display: block; }
            .player-panel.fullscreen .player-info-container { flex-direction: column; align-items: flex-start; margin-top: 6vh; pointer-events: auto; }
            .player-panel.fullscreen .now-playing-img { width: 100%; height: auto; max-height: 45vh; aspect-ratio: 1; border-radius: 8px; margin-bottom: 32px; pointer-events: auto; box-shadow: 0 10px 40px rgba(0,0,0,0.5);}
            .player-panel.fullscreen .track-metadata { pointer-events: auto; }
            .player-panel.fullscreen .player-title { font-size: 28px; margin-bottom: 8px;}
            .player-panel.fullscreen .player-artist { font-size: 18px; }

            .player-panel.fullscreen .hide-on-mobile { display: flex; }
            .player-panel.fullscreen .yt-action-btns { display: flex; margin-top: 24px; }
            .player-panel.fullscreen .volume-container { display: flex; }

            .player-panel.fullscreen .progress-container { position: relative; top: auto; bottom: auto; height: auto; margin: 32px 0; pointer-events: auto;}
            .player-panel.fullscreen .progress-bar-wrapper { height: 24px; border-radius: 4px; }
            .player-panel.fullscreen .progress-bar { height: 4px; border-radius: 2px; }
            .player-panel.fullscreen .progress-fill { border-radius: 2px; }
            .player-panel.fullscreen #currentTimeDisplay, .player-panel.fullscreen #durationDisplay { display: block; font-size: 13px; }
            .player-panel.fullscreen .progress-fill::after { display: block; }

            .player-panel.fullscreen .player-controls { width: 100%; justify-content: space-between; margin-bottom: 24px; }
            .player-panel.fullscreen .play-btn { width: 72px; height: 72px; background: var(--text-primary); color: var(--bg-color); }
            .player-panel.fullscreen .play-btn .material-symbols-rounded { font-size: 40px; }
            .player-panel.fullscreen .control-btn { width: 48px; height: 48px; }
        }
    </style>
</head>
<body>

    <aside class="nav-sidebar">
        <div class="logo"><span class="material-symbols-rounded">play_circle</span> Music</div>
        <ul class="nav-links">
            <li class="nav-link active focusable" tabindex="0" onclick="switchTab('home')" data-section="left" id="nav-home"><span class="material-symbols-rounded">home</span> Home</li>
            <li class="nav-link focusable" tabindex="0" onclick="switchTab('radio')" data-section="left"><span class="material-symbols-rounded">explore</span> Radio</li>
            <li class="nav-link focusable" tabindex="0" onclick="switchTab('library')" data-section="left"><span class="material-symbols-rounded">library_music</span> Library</li>
            <li class="nav-link focusable" tabindex="0" onclick="switchTab('settings')" data-section="left"><span class="material-symbols-rounded">settings</span> Settings</li>
        </ul>
    </aside>

    <main class="main-content">
        <header class="top-bar">
            <div class="search-bar focusable" tabindex="0" id="searchBar" data-section="middle">
                <span class="material-symbols-rounded text-sub" style="color: var(--text-secondary);">search</span>
                <input type="text" id="searchInput" placeholder="Search songs, albums, artists" autocomplete="off">
            </div>
            <div class="profile-icon focusable" tabindex="0" data-section="middle" id="profileIcon">A</div>
        </header>
        <div id="searchResults" class="search-results" role="listbox" aria-label="Search results"></div>

        <div id="view-home" class="view-content active">
            <h1 class="greeting-header" id="greetingHeader">Good morning</h1>

            <div class="mood-container">
                <button class="mood-pill focusable" tabindex="0" data-section="middle">Relax</button>
                <button class="mood-pill focusable" tabindex="0" data-section="middle">Workout</button>
                <button class="mood-pill focusable" tabindex="0" data-section="middle">Focus</button>
                <button class="mood-pill focusable" tabindex="0" data-section="middle">Energize</button>
                <button class="mood-pill focusable" tabindex="0" data-section="middle">Commute</button>
                <button class="mood-pill focusable" tabindex="0" data-section="middle">Podcasts</button>
            </div>

            <h2 class="section-title">Tracks</h2>
            <div class="home-scroll" id="homeTracksScroll"></div>

            <h2 class="section-title">Albums</h2>
            <div class="home-scroll" id="homeAlbumsScroll"></div>

            <h2 class="section-title">Artists</h2>
            <div class="artist-strip" id="homeArtistsStrip"></div>
        </div>

        <div id="view-radio" class="view-content">
            <h2 class="section-title">Radio</h2>
            <div class="grid-container" id="radioGrid"></div>
        </div>
        <div id="view-library" class="view-content">
            <h2 class="section-title">Library</h2>
            <div class="grid-container" id="libraryGrid"></div>
        </div>
        <div id="view-settings" class="view-content">
            <h2 class="section-title">Settings</h2>
            <div class="settings-panel">
                <div class="settings-field">
                    <label for="settingsDisplayName">Name for home greeting</label>
                    <input type="text" id="settingsDisplayName" maxlength="80" placeholder="Your name">
                </div>
                <div class="theme-toggle-row">
                    <span>Appearance</span>
                    <button type="button" class="mood-pill focusable" tabindex="0" data-section="middle" id="themeToggleBtn">Theme</button>
                </div>
            </div>
        </div>
    </main>

    <aside class="player-panel" id="playerPanel">
        <button class="close-player-btn" id="closePlayerBtn"><span class="material-symbols-rounded">expand_more</span></button>

        <audio id="audioEngine" preload="metadata"></audio>

        <div class="player-info-container">
            <img src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=300&q=80" class="now-playing-img" id="playerImg" alt="">
            <div class="track-metadata">
                <h3 class="player-title" id="playerTitle">—</h3>
                <p class="player-artist" id="playerArtist">—</p>
            </div>

            <div class="yt-action-btns hide-for-radio" id="ytActionRow">
                <button class="action-btn focusable hide-for-radio" tabindex="0" data-section="right"><span class="material-symbols-rounded">thumb_up</span></button>
                <button class="action-btn focusable hide-for-radio" tabindex="0" data-section="right"><span class="material-symbols-rounded">thumb_down</span></button>
                <button class="action-btn focusable hide-for-radio" tabindex="0" data-section="right"><span class="material-symbols-rounded">playlist_add</span></button>
                <button class="action-btn focusable" tabindex="0" data-section="right"><span class="material-symbols-rounded">share</span></button>
                <button class="action-btn focusable" tabindex="0" data-section="right"><span class="material-symbols-rounded">more_vert</span></button>
            </div>
        </div>

        <div class="progress-container">
            <span id="currentTimeDisplay" class="hide-on-mobile">0:00</span>
            <div class="progress-bar-wrapper focusable prevent-expand" tabindex="0" id="progressWrapper" data-section="right">
                <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            </div>
            <span id="durationDisplay" class="hide-on-mobile">0:00</span>
        </div>

        <div class="player-controls">
            <button type="button" class="control-btn focusable hide-on-mobile hide-for-radio prevent-expand" tabindex="0" data-section="right" id="shuffleBtn" title="Shuffle"><span class="material-symbols-rounded">shuffle</span></button>
            <button type="button" class="control-btn focusable hide-on-mobile prevent-expand" tabindex="0" data-section="right" id="prevBtn" title="Previous"><span class="material-symbols-rounded" style="font-variation-settings: 'FILL' 1">skip_previous</span></button>

            <button type="button" class="control-btn play-btn focusable prevent-expand" tabindex="0" id="playPauseBtn" data-section="right">
                <span class="material-symbols-rounded" id="playIcon" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
            </button>

            <button type="button" class="control-btn focusable prevent-expand" tabindex="0" data-section="right" id="nextBtn" title="Next"><span class="material-symbols-rounded" style="font-variation-settings: 'FILL' 1">skip_next</span></button>
            <button type="button" class="control-btn focusable hide-on-mobile hide-for-radio prevent-expand" tabindex="0" data-section="right" id="repeatBtn" title="Repeat"><span class="material-symbols-rounded" id="repeatIcon">repeat</span></button>
        </div>

        <div class="volume-container hide-on-mobile">
            <span class="material-symbols-rounded" id="volumeIcon" style="color: var(--text-secondary);">volume_up</span>
            <div class="volume-bar-wrapper focusable prevent-expand" tabindex="0" id="volumeWrapper" data-section="right">
                <div class="volume-bar"><div class="volume-fill" id="volumeFill"></div></div>
            </div>
        </div>
    </aside>

    <nav class="mobile-nav">
        <ul class="mobile-nav-list">
            <li class="mobile-nav-item active focusable" tabindex="0" onclick="switchTab('home')" data-section="left"><span class="material-symbols-rounded">home</span>Home</li>
            <li class="mobile-nav-item focusable" tabindex="0" onclick="switchTab('radio')" data-section="left"><span class="material-symbols-rounded">explore</span>Radio</li>
            <li class="mobile-nav-item focusable" tabindex="0" onclick="switchTab('library')" data-section="left"><span class="material-symbols-rounded">library_music</span>Library</li>
            <li class="mobile-nav-item focusable" tabindex="0" onclick="switchTab('settings')" data-section="left"><span class="material-symbols-rounded">settings</span>Settings</li>
        </ul>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
    <script>
        const SONGS_TXT_URL = '../audio/songs.txt';
        const AUDIO_FOLDER = '../audio/';

        const RADIO_STATIONS = [
            {
                name: "AIR FM Rainbow",
                tagline: "Musically Yours",
                frequency: "105.4 FM",
                stream: "https://air.pc.cdn.bitgravity.com/air/live/pbaudio048/playlist.m3u8",
                image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSlf058gXuF_uYPzppTWJ4kQ_gsRAVs7fzrqw&s"
            },
            {
                name: "Indigo",
                tagline: "Radio Station for a Fun Young Goa",
                frequency: "91.9 FM",
                stream: "https://cast5.asurahosting.com/proxy/spooler/stream",
                image: "https://onlineradiofm.in/assets/image/radio/180/Indigo_91.9_FM_Official_LOGO.jpg"
            },
            {
                name: "Radio Mirchi",
                tagline: "Mirchi Sunne Waale Always Khush!",
                frequency: "98.3 FM",
                stream: "https://eu8.fastcast4u.com/proxy/clyedupq?mp=%2F1?aw_0_req_lsid=2c0fae177108c9a42a7cf24878625444",
                image: "https://onlineradiofm.in/assets/image/radio/180/radio-mirchi.webp"
            },
            {
                name: "Big FM",
                tagline: "Dhun Badal Ke Toh Dekho",
                frequency: "92.7 FM",
                stream: "https://stream.zeno.fm/dbstwo3dvhhtv",
                image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTw5-iWyUF8zCz9VY8vMkWCRwQYTs0NN9XmOg&s"
            },
            {
                name: "Radio Goa",
                tagline: "Feel Goa, feel good",
                frequency: "N/A",
                stream: "https://radio.faleiro.uk/radio/8000/radio.mp3",
                image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQgloY-5k6wEp1hop9dlUb1XcEqNjJVU2GLWA&s"
            },
            {
                name: "4Lobo (Konkani)",
                tagline: "",
                frequency: "Online",
                stream: "https://puma.streemlion.com:4465/stream",
                image: "https://i.pinimg.com/564x/18/07/ac/1807ac843c79afe6477868f93d11b95c.jpg"
            }
        ];

        let catalog = [];
        let hlsPlayer = null;

        let playQueue = [];
        let queueIndex = 0;
        let shuffleOn = false;
        let repeatMode = 0; // 0 off, 1 all, 2 one

        const LS_NAME = 'ytm_user_name';
        const LS_THEME = 'ytm_theme';

        function detachHls() {
            if (hlsPlayer) {
                hlsPlayer.destroy();
                hlsPlayer = null;
            }
        }

        function setAudioSource(url) {
            detachHls();
            if (!url) return;
            const isHls = /\.m3u8(\?|$)/i.test(url);
            if (isHls && typeof Hls !== 'undefined' && Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(audio);
                hlsPlayer = hls;
            } else {
                audio.src = url;
            }
        }

        function parseSongBlock(block) {
            const meta = {};
            for (const line of block.split(/\r?\n/)) {
                if (!line.startsWith('#')) continue;
                const m = line.match(/^#([^:]+):\s*(.*)$/);
                if (m) meta[m[1].trim().toLowerCase()] = m[2].trim();
            }
            const file = meta.file;
            if (!file) return null;
            const title = meta.title || 'Untitled';
            const artist = meta.artist || 'Unknown artist';
            const album = meta.album || '';
            const cover = meta['aa link'] || '';
            const src = AUDIO_FOLDER + file.replace(/^\/+/, '');
            return { title, artist, album, cover, src, file, kind: 'music' };
        }

        function parseSongsCatalog(text) {
            return text
                .split(/\r?\n={3,}\r?\n/)
                .map((s) => s.trim())
                .filter(Boolean)
                .map(parseSongBlock)
                .filter(Boolean);
        }

        async function loadCatalog() {
            const res = await fetch(SONGS_TXT_URL, { cache: 'no-store' });
            if (!res.ok) throw new Error('songs.txt HTTP ' + res.status);
            return parseSongsCatalog(await res.text());
        }

        function shuffleArray(arr) {
            const a = arr.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function makePlayOverlay() {
            const overlay = document.createElement('div');
            overlay.className = 'play-overlay';
            const circle = document.createElement('div');
            circle.className = 'play-circle';
            const icon = document.createElement('span');
            icon.className = 'material-symbols-rounded';
            icon.textContent = 'play_arrow';
            circle.appendChild(icon);
            overlay.appendChild(circle);
            return overlay;
        }

        function buildMusicQueue(startTrack) {
            const base = catalog.map((t) => ({ ...t, kind: 'music' }));
            let idx = base.findIndex((t) => t.src === startTrack.src);
            if (idx < 0) idx = 0;
            let ordered = base.slice(idx).concat(base.slice(0, idx));
            if (shuffleOn) {
                const head = ordered[0];
                const tail = shuffleArray(ordered.slice(1));
                ordered = [head, ...tail];
            }
            playQueue = ordered;
            queueIndex = 0;
        }

        function buildRadioQueue(startIndex) {
            playQueue = RADIO_STATIONS.map((st) => ({
                kind: 'radio',
                title: st.name,
                artist: st.tagline || st.frequency || 'Radio',
                cover: st.image,
                src: st.stream
            }));
            queueIndex = Math.max(0, Math.min(startIndex | 0, playQueue.length - 1));
        }

        function playCurrentFromQueue() {
            const track = playQueue[queueIndex];
            if (!track) return;
            document.getElementById('playerTitle').textContent = track.title;
            document.getElementById('playerArtist').textContent = track.artist;
            if (track.cover) document.getElementById('playerImg').src = track.cover;
            audio.pause();
            audio.currentTime = 0;
            setAudioSource(track.src);
            audio.play().catch((err) => console.log('Media waiting...', err));
            playIcon.textContent = 'pause';
            updateRepeatShuffleUI();
        }

        function playTrack(song) {
            buildMusicQueue(song);
            playCurrentFromQueue();
        }

        function playNext() {
            if (!playQueue.length) return;
            if (repeatMode === 2) {
                audio.currentTime = 0;
                audio.play().catch(() => {});
                return;
            }
            if (queueIndex < playQueue.length - 1) queueIndex++;
            else if (repeatMode === 1) queueIndex = 0;
            else return;
            playCurrentFromQueue();
        }

        function playPrev() {
            if (!playQueue.length) return;
            const cur = playQueue[queueIndex];
            if (cur && cur.kind === 'music') {
                const dur = audio.duration;
                if (isFinite(dur) && dur > 0 && audio.currentTime > 3) {
                    audio.currentTime = 0;
                    return;
                }
            }
            if (queueIndex > 0) queueIndex--;
            else if (repeatMode === 1) queueIndex = playQueue.length - 1;
            else return;
            playCurrentFromQueue();
        }

        function updateRepeatShuffleUI() {
            const shuffleBtn = document.getElementById('shuffleBtn');
            const repeatBtn = document.getElementById('repeatBtn');
            const repeatIcon = document.getElementById('repeatIcon');
            if (shuffleBtn) shuffleBtn.classList.toggle('active-mode', shuffleOn);
            if (repeatBtn && repeatIcon) {
                repeatBtn.classList.toggle('active-mode', repeatMode !== 0);
                repeatIcon.textContent = repeatMode === 2 ? 'repeat_one' : 'repeat';
            }
        }

        function setPlayerRadioChrome() {
            const panel = document.getElementById('playerPanel');
            const radioView = document.getElementById('view-radio');
            if (panel) panel.classList.toggle('radio-mode', !!(radioView && radioView.classList.contains('active')));
        }

        function updateGreeting() {
            const raw = (localStorage.getItem(LS_NAME) || '').trim();
            const name = raw || 'Alex';
            const h = new Date().getHours();
            let part = 'Good evening';
            if (h < 12) part = 'Good morning';
            else if (h < 17) part = 'Good afternoon';
            document.getElementById('greetingHeader').textContent = `${part}, ${name}`;
        }

        function applyThemeFromStorage() {
            const t = localStorage.getItem(LS_THEME) || 'dark';
            document.body.classList.toggle('theme-light', t === 'light');
            syncThemeButtonLabel();
        }

        function syncThemeButtonLabel() {
            const btn = document.getElementById('themeToggleBtn');
            if (!btn) return;
            btn.textContent = document.body.classList.contains('theme-light') ? 'Dark mode' : 'Light mode';
        }

        function groupAlbums(tracks) {
            const map = new Map();
            for (const tr of tracks) {
                const key = (tr.album && tr.album.trim()) ? tr.album.trim() : tr.title;
                if (!map.has(key)) map.set(key, { album: key, cover: tr.cover, tracks: [] });
                map.get(key).tracks.push(tr);
            }
            return [...map.values()];
        }

        function uniqueArtists(tracks) {
            const set = new Set();
            tracks.forEach((tr) => {
                (tr.artist || '').split(/[,&]/).map((s) => s.trim()).filter(Boolean).forEach((a) => set.add(a));
            });
            return [...set];
        }

        function renderSongCards(container, songs, { markFirst } = {}) {
            container.innerHTML = '';
            songs.forEach((song, i) => {
                const card = document.createElement('div');
                card.className = 'card focusable';
                card.tabIndex = 0;
                card.dataset.section = 'middle';
                if (markFirst && i === 0) card.id = 'first-home-card';
                card.addEventListener('click', () => playTrack(song));

                const wrap = document.createElement('div');
                wrap.className = 'card-img-wrapper';
                const img = document.createElement('img');
                img.className = 'card-img';
                img.src = song.cover || '';
                img.alt = '';
                img.loading = 'lazy';
                wrap.appendChild(img);
                wrap.appendChild(makePlayOverlay());

                const h3 = document.createElement('h3');
                h3.className = 'now-playing-title';
                h3.textContent = song.title;

                card.appendChild(wrap);
                card.appendChild(h3);
                container.appendChild(card);
            });
        }

        function renderHomeExplore() {
            const tracksEl = document.getElementById('homeTracksScroll');
            const albumsEl = document.getElementById('homeAlbumsScroll');
            const artistsEl = document.getElementById('homeArtistsStrip');
            tracksEl.innerHTML = '';
            albumsEl.innerHTML = '';
            artistsEl.innerHTML = '';

            const pick = shuffleArray(catalog);
            const trackPick = pick.slice(0, Math.min(12, pick.length));
            trackPick.forEach((song, i) => {
                const card = document.createElement('div');
                card.className = 'card focusable';
                card.tabIndex = 0;
                card.dataset.section = 'middle';
                if (i === 0) card.id = 'first-home-card';
                card.addEventListener('click', () => playTrack(song));
                const wrap = document.createElement('div');
                wrap.className = 'card-img-wrapper';
                const img = document.createElement('img');
                img.className = 'card-img';
                img.src = song.cover || '';
                img.alt = '';
                img.loading = 'lazy';
                wrap.appendChild(img);
                wrap.appendChild(makePlayOverlay());
                const h3 = document.createElement('h3');
                h3.className = 'now-playing-title';
                h3.textContent = song.title;
                card.appendChild(wrap);
                card.appendChild(h3);
                tracksEl.appendChild(card);
            });

            const allAlbums = groupAlbums(catalog);
            const albumGroups = shuffleArray(allAlbums).slice(0, Math.min(10, allAlbums.length));
            albumGroups.forEach((g) => {
                const card = document.createElement('div');
                card.className = 'card focusable';
                card.tabIndex = 0;
                card.dataset.section = 'middle';
                card.addEventListener('click', () => {
                    const first = g.tracks[0];
                    const rest = g.tracks.slice(1).map((t) => ({ ...t, kind: 'music' }));
                    const head = { ...first, kind: 'music' };
                    playQueue = shuffleOn ? [head, ...shuffleArray(rest)] : [head, ...rest];
                    queueIndex = 0;
                    playCurrentFromQueue();
                });
                const wrap = document.createElement('div');
                wrap.className = 'card-img-wrapper';
                const img = document.createElement('img');
                img.className = 'card-img';
                img.src = g.cover || (g.tracks[0] && g.tracks[0].cover) || '';
                img.alt = '';
                img.loading = 'lazy';
                wrap.appendChild(img);
                wrap.appendChild(makePlayOverlay());
                const h3 = document.createElement('h3');
                h3.className = 'now-playing-title';
                h3.textContent = g.album;
                card.appendChild(wrap);
                card.appendChild(h3);
                albumsEl.appendChild(card);
            });

            const allArtists = uniqueArtists(catalog);
            const artists = shuffleArray(allArtists).slice(0, Math.min(14, allArtists.length));
            artists.forEach((name) => {
                const match = catalog.find((tr) => (tr.artist || '').includes(name));
                const chip = document.createElement('div');
                chip.className = 'artist-chip focusable';
                chip.tabIndex = 0;
                chip.dataset.section = 'middle';
                chip.addEventListener('click', () => {
                    const subset = catalog.filter((tr) => (tr.artist || '').includes(name));
                    if (!subset.length) return;
                    let q = subset.map((t) => ({ ...t, kind: 'music' }));
                    if (shuffleOn) q = [q[0], ...shuffleArray(q.slice(1))];
                    playQueue = q;
                    queueIndex = 0;
                    playCurrentFromQueue();
                });
                const av = document.createElement('div');
                av.className = 'artist-avatar';
                const im = document.createElement('img');
                im.src = (match && match.cover) || '';
                im.alt = '';
                av.appendChild(im);
                const nm = document.createElement('div');
                nm.className = 'artist-name';
                nm.textContent = name;
                chip.appendChild(av);
                chip.appendChild(nm);
                artistsEl.appendChild(chip);
            });
        }

        function renderRadioStations() {
            const container = document.getElementById('radioGrid');
            container.innerHTML = '';
            RADIO_STATIONS.forEach((st, idx) => {
                const card = document.createElement('div');
                card.className = 'card focusable';
                card.tabIndex = 0;
                card.dataset.section = 'middle';
                card.dataset.remoteZone = 'radio';
                const subtitle = [st.frequency, st.tagline].filter(Boolean).join(' · ');
                card.addEventListener('click', () => {
                    buildRadioQueue(idx);
                    playCurrentFromQueue();
                });

                const wrap = document.createElement('div');
                wrap.className = 'card-img-wrapper';
                const img = document.createElement('img');
                img.className = 'card-img';
                img.src = st.image || '';
                img.alt = '';
                img.loading = 'lazy';
                wrap.appendChild(img);
                wrap.appendChild(makePlayOverlay());

                const h3 = document.createElement('h3');
                h3.className = 'now-playing-title';
                h3.textContent = st.name;
                const meta = document.createElement('p');
                meta.className = 'radio-meta';
                meta.textContent = subtitle;

                card.appendChild(wrap);
                card.appendChild(h3);
                card.appendChild(meta);
                container.appendChild(card);
            });
        }

        function showLoadError(message) {
            const html = '<p class="text-sub" style="padding:16px;">' + message + '</p>';
            document.getElementById('homeTracksScroll').innerHTML = html;
            document.getElementById('homeAlbumsScroll').innerHTML = '';
            document.getElementById('homeArtistsStrip').innerHTML = '';
            document.getElementById('libraryGrid').innerHTML = html;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const nameInput = document.getElementById('settingsDisplayName');
            nameInput.value = localStorage.getItem(LS_NAME) || '';
            nameInput.addEventListener('change', () => {
                localStorage.setItem(LS_NAME, nameInput.value.trim());
                updateGreeting();
            });
            nameInput.addEventListener('blur', () => {
                localStorage.setItem(LS_NAME, nameInput.value.trim());
                updateGreeting();
            });

            document.getElementById('themeToggleBtn').addEventListener('click', () => {
                const nextLight = !document.body.classList.contains('theme-light');
                document.body.classList.toggle('theme-light', nextLight);
                localStorage.setItem(LS_THEME, nextLight ? 'light' : 'dark');
                syncThemeButtonLabel();
            });

            applyThemeFromStorage();
            updateGreeting();
            renderRadioStations();
            setPlayerRadioChrome();

            (async () => {
                try {
                    catalog = await loadCatalog();
                    if (!catalog.length) {
                        showLoadError('No songs found in songs.txt (missing #File: entries).');
                        return;
                    }
                    renderHomeExplore();
                    renderSongCards(document.getElementById('libraryGrid'), catalog, { markFirst: false });
                    buildMusicQueue(catalog[0]);
                    document.getElementById('playerTitle').textContent = playQueue[0].title;
                    document.getElementById('playerArtist').textContent = playQueue[0].artist;
                    if (playQueue[0].cover) document.getElementById('playerImg').src = playQueue[0].cover;
                    setAudioSource(playQueue[0].src);
                    document.getElementById('playIcon').textContent = 'play_arrow';
                    updateRepeatShuffleUI();
                } catch (err) {
                    console.error(err);
                    showLoadError('Could not load <code>../audio/songs.txt</code>. Serve this page over HTTP(S) with <code>audio/songs.txt</code> beside <code>music-player/player.html</code> (opening as file:// will block fetch).');
                }
            })();
        });

        // ==========================================
        // UI & MOBILE PLAYER LOGIC
        // ==========================================
        function switchTab(tabId) {
            document.querySelectorAll('.view-content').forEach((view) => view.classList.remove('active'));
            document.querySelectorAll('.nav-link, .mobile-nav-item').forEach((link) => link.classList.remove('active'));
            document.getElementById('view-' + tabId).classList.add('active');
            document.querySelectorAll(`[onclick="switchTab('${tabId}')"]`).forEach((link) => link.classList.add('active'));
            document.querySelector('.main-content').scrollTo(0, 0);
            const sr = document.getElementById('searchResults');
            if (sr) {
                sr.classList.remove('active');
                sr.innerHTML = '';
            }
            setPlayerRadioChrome();
            if (tabId === 'radio') {
                const first = document.querySelector('#radioGrid .focusable');
                if (first && window.innerWidth > 850) setTimeout(() => first.focus(), 0);
            }
        }

        const playerPanel = document.getElementById('playerPanel');
        const closePlayerBtn = document.getElementById('closePlayerBtn');

        playerPanel.addEventListener('click', (e) => {
            if (window.innerWidth <= 850 && !e.target.closest('.prevent-expand') && !e.target.closest('.action-btn')) {
                playerPanel.classList.add('fullscreen');
            }
        });

        closePlayerBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            playerPanel.classList.remove('fullscreen');
        });

        // ==========================================
        // AUDIO ENGINE LOGIC
        // ==========================================
        const audio = document.getElementById('audioEngine');
        const playBtn = document.getElementById('playPauseBtn');
        const playIcon = document.getElementById('playIcon');
        const progressFill = document.getElementById('progressFill');
        const currentTimeDisplay = document.getElementById('currentTimeDisplay');
        const durationDisplay = document.getElementById('durationDisplay');

        function formatTime(seconds) {
            if (!isFinite(seconds) || isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        playBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (audio.paused) {
                audio.play().catch((err) => console.log('Media waiting...', err));
                playIcon.textContent = 'pause';
            } else {
                audio.pause();
                playIcon.textContent = 'play_arrow';
            }
        });

        audio.addEventListener('pause', () => { playIcon.textContent = 'play_arrow'; });
        audio.addEventListener('play', () => { playIcon.textContent = 'pause'; });

        audio.addEventListener('timeupdate', () => {
            currentTimeDisplay.textContent = formatTime(audio.currentTime);
            const dur = audio.duration;
            if (isFinite(dur) && dur > 0) {
                durationDisplay.textContent = formatTime(dur);
                progressFill.style.width = `${(audio.currentTime / dur) * 100}%`;
            } else {
                durationDisplay.textContent = '—';
                progressFill.style.width = '0%';
            }
        });

        audio.addEventListener('loadedmetadata', () => { durationDisplay.textContent = formatTime(audio.duration); });

        document.getElementById('progressWrapper').addEventListener('click', (e) => {
            e.stopPropagation();
            const rect = e.currentTarget.getBoundingClientRect();
            const dur = audio.duration;
            if (isFinite(dur) && dur > 0) audio.currentTime = ((e.clientX - rect.left) / rect.width) * dur;
        });

        const volumeWrapper = document.getElementById('volumeWrapper');
        const volumeFill = document.getElementById('volumeFill');
        let volumePointerActive = false;

        function applyVolumeRatio(ratio) {
            const r = Math.max(0, Math.min(1, ratio));
            audio.volume = r;
            volumeFill.style.width = (r * 100) + '%';
            const volIcon = document.getElementById('volumeIcon');
            if (r === 0) volIcon.textContent = 'volume_off';
            else if (r < 0.5) volIcon.textContent = 'volume_down';
            else volIcon.textContent = 'volume_up';
        }

        function applyVolumeFromClientX(clientX) {
            const rect = volumeWrapper.getBoundingClientRect();
            const ratio = rect.width ? (clientX - rect.left) / rect.width : 0;
            applyVolumeRatio(ratio);
        }

        volumeWrapper.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            volumePointerActive = true;
            volumeWrapper.setPointerCapture(e.pointerId);
            applyVolumeFromClientX(e.clientX);
        });
        volumeWrapper.addEventListener('pointermove', (e) => {
            if (!volumePointerActive) return;
            applyVolumeFromClientX(e.clientX);
        });
        volumeWrapper.addEventListener('pointerup', (e) => {
            volumePointerActive = false;
            try { volumeWrapper.releasePointerCapture(e.pointerId); } catch (_) {}
        });
        volumeWrapper.addEventListener('pointercancel', () => { volumePointerActive = false; });

        document.getElementById('shuffleBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            if (playQueue[queueIndex] && playQueue[queueIndex].kind === 'radio') return;
            shuffleOn = !shuffleOn;
            if (playQueue.length && playQueue[queueIndex] && playQueue[queueIndex].kind === 'music') {
                buildMusicQueue(playQueue[queueIndex]);
            }
            updateRepeatShuffleUI();
        });

        document.getElementById('repeatBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            repeatMode = (repeatMode + 1) % 3;
            updateRepeatShuffleUI();
        });

        document.getElementById('nextBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            playNext();
        });

        document.getElementById('prevBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            playPrev();
        });

        audio.addEventListener('ended', () => {
            if (repeatMode === 2) {
                audio.currentTime = 0;
                audio.play().catch(() => {});
                return;
            }
            playNext();
        });

        document.addEventListener('contextmenu', (e) => {
            const el = document.activeElement;
            if (!el || !el.classList || !el.classList.contains('focusable')) return;
            if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') return;
            e.preventDefault();
            el.click();
        });

        const searchInput = document.getElementById('searchInput');
        const searchResultsEl = document.getElementById('searchResults');

        function norm(s) {
            return (s || '').toLowerCase();
        }

        function runSearch() {
            const q = searchInput.value.trim().toLowerCase();
            if (!q) {
                searchResultsEl.classList.remove('active');
                searchResultsEl.innerHTML = '';
                return;
            }
            if (!catalog.length) {
                searchResultsEl.innerHTML = '';
                searchResultsEl.classList.remove('active');
                return;
            }
            const out = [];
            catalog.forEach((t) => {
                const hay = norm([t.title, t.artist, t.album].join(' '));
                if (hay.includes(q)) out.push({ type: 'song', title: t.title, sub: [t.artist, t.album].filter(Boolean).join(' · '), img: t.cover, track: t });
            });
            const seen = new Set();
            groupAlbums(catalog).forEach((g) => {
                const hay = norm(g.album);
                if (hay.includes(q) && !seen.has(g.album)) {
                    seen.add(g.album);
                    out.push({ type: 'album', title: g.album, sub: `${g.tracks.length} tracks`, img: g.cover || (g.tracks[0] && g.tracks[0].cover), group: g });
                }
            });
            uniqueArtists(catalog).forEach((a) => {
                if (norm(a).includes(q)) out.push({ type: 'artist', title: a, sub: 'Artist', img: (catalog.find((tr) => (tr.artist || '').includes(a)) || {}).cover, name: a });
            });
            RADIO_STATIONS.forEach((st, idx) => {
                const hay = norm([st.name, st.tagline, st.frequency].join(' '));
                if (hay.includes(q)) out.push({ type: 'radio', title: st.name, sub: [st.frequency, st.tagline].filter(Boolean).join(' · '), img: st.image, idx });
            });

            searchResultsEl.innerHTML = '';
            if (!out.length) {
                const empty = document.createElement('div');
                empty.className = 'search-result-row text-sub';
                empty.style.cursor = 'default';
                empty.textContent = 'No results';
                searchResultsEl.appendChild(empty);
            } else {
                out.slice(0, 40).forEach((row) => {
                    const div = document.createElement('div');
                    div.className = 'search-result-row focusable';
                    div.tabIndex = 0;
                    div.dataset.section = 'middle';
                    const img = document.createElement('img');
                    img.src = row.img || '';
                    img.alt = '';
                    const meta = document.createElement('div');
                    meta.className = 'search-result-meta';
                    const t1 = document.createElement('div');
                    t1.className = 'search-result-title';
                    t1.textContent = row.title;
                    const t2 = document.createElement('div');
                    t2.className = 'search-result-sub';
                    t2.textContent = (row.type ? row.type + ' · ' : '') + row.sub;
                    meta.appendChild(t1);
                    meta.appendChild(t2);
                    div.appendChild(img);
                    div.appendChild(meta);
                    div.addEventListener('click', () => {
                        if (row.type === 'song') playTrack(row.track);
                        else if (row.type === 'album' && row.group) {
                            const g = row.group;
                            const head = { ...g.tracks[0], kind: 'music' };
                            const rest = g.tracks.slice(1).map((t) => ({ ...t, kind: 'music' }));
                            playQueue = shuffleOn ? [head, ...shuffleArray(rest)] : [head, ...rest];
                            queueIndex = 0;
                            playCurrentFromQueue();
                        } else if (row.type === 'artist') {
                            const subset = catalog.filter((tr) => (tr.artist || '').includes(row.name));
                            let qv = subset.map((t) => ({ ...t, kind: 'music' }));
                            if (shuffleOn) qv = [qv[0], ...shuffleArray(qv.slice(1))];
                            playQueue = qv;
                            queueIndex = 0;
                            playCurrentFromQueue();
                        } else if (row.type === 'radio') {
                            buildRadioQueue(row.idx);
                            playCurrentFromQueue();
                        }
                        searchResultsEl.classList.remove('active');
                        searchResultsEl.innerHTML = '';
                        searchInput.value = '';
                    });
                    searchResultsEl.appendChild(div);
                });
            }
            searchResultsEl.classList.add('active');
        }

        searchInput.addEventListener('input', () => runSearch());
        searchInput.addEventListener('focus', () => {
            if (searchInput.value.trim()) runSearch();
        });

        document.addEventListener('click', (e) => {
            if (!searchResultsEl.classList.contains('active')) return;
            if (e.target.closest('#searchBar') || e.target.closest('#searchResults')) return;
            searchResultsEl.classList.remove('active');
        });

        document.addEventListener('keydown', (e) => {
            if (e.key !== 'Escape') return;
            if (searchResultsEl.classList.contains('active')) {
                searchResultsEl.classList.remove('active');
                searchResultsEl.innerHTML = '';
            }
        });

        // ==========================================
        // ADVANCED SPATIAL (TV) NAVIGATION ENGINE
        // ==========================================
        document.addEventListener('keydown', (e) => {
            if (window.innerWidth <= 850) return;

            const allowedKeys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter'];
            if (!allowedKeys.includes(e.key)) return;

            const current = document.activeElement;

            const radioViewActive = document.getElementById('view-radio').classList.contains('active');
            if (radioViewActive && current && current.closest('#radioGrid')) {
                const cards = [...document.querySelectorAll('#radioGrid .focusable')];
                const idx = cards.indexOf(current);
                if (idx >= 0) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        current.click();
                        return;
                    }
                    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) {
                        e.preventDefault();
                        let n = idx;
                        if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') n = Math.max(0, idx - 1);
                        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') n = Math.min(cards.length - 1, idx + 1);
                        cards[n].focus();
                        cards[n].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                        return;
                    }
                }
            }

            if (current && current.id === 'volumeWrapper' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
                e.preventDefault();
                let vol = audio.volume;
                vol += (e.key === 'ArrowRight') ? 0.1 : -0.1;
                vol = Math.max(0, Math.min(1, vol));
                audio.volume = vol;
                document.getElementById('volumeFill').style.width = (vol * 100) + '%';
                const volIcon = document.getElementById('volumeIcon');
                if (vol === 0) volIcon.innerText = 'volume_off';
                else if (vol < 0.5) volIcon.innerText = 'volume_down';
                else volIcon.innerText = 'volume_up';
                return;
            }

            if (current && current.id === 'progressWrapper' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
                e.preventDefault();
                const dur = audio.duration;
                if (isFinite(dur) && dur > 0) {
                    let percent = audio.currentTime / dur;
                    percent += (e.key === 'ArrowRight') ? 0.05 : -0.05;
                    percent = Math.max(0, Math.min(1, percent));
                    audio.currentTime = percent * dur;
                }
                return;
            }

            if (current && current.classList.contains('action-btn') && e.key === 'ArrowUp') { e.preventDefault(); return; }

            if (e.key === 'Enter') {
                if (current && current.classList.contains('focusable')) {
                    current.click();
                    if (current.id === 'searchBar') current.querySelector('input').focus();
                }
                return;
            }

            e.preventDefault();

            let explicitMatch = null;
            if (current && current.classList.contains('mood-pill') && e.key === 'ArrowUp') explicitMatch = document.getElementById('searchBar');
            else if (current && current.id === 'searchBar' && e.key === 'ArrowRight') explicitMatch = document.getElementById('profileIcon');
            else if (current && current.id === 'profileIcon' && e.key === 'ArrowLeft') explicitMatch = document.getElementById('searchBar');
            else if (current && current.id === 'profileIcon' && e.key === 'ArrowRight') explicitMatch = document.getElementById('playPauseBtn');

            if (explicitMatch) {
                explicitMatch.focus();
                explicitMatch.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'nearest' });
                return;
            }

            const focusables = Array.from(document.querySelectorAll('.focusable')).filter((el) => {
                const rect = el.getBoundingClientRect();
                return rect.width > 0 && rect.height > 0 && window.getComputedStyle(el).display !== 'none';
            });

            if (!focusables.includes(current)) { if (focusables.length > 0) focusables[0].focus(); return; }

            const currentRect = current.getBoundingClientRect();
            const currentCenter = { x: currentRect.left + currentRect.width / 2, y: currentRect.top + currentRect.height / 2 };

            let bestMatchSame = null, shortestDistSame = Infinity;
            let bestMatchOther = null, shortestDistOther = Infinity;
            const currentSection = current.dataset.section;

            focusables.forEach((target) => {
                if (target === current) return;
                const targetRect = target.getBoundingClientRect();
                const targetCenter = { x: targetRect.left + targetRect.width / 2, y: targetRect.top + targetRect.height / 2 };

                const dx = targetCenter.x - currentCenter.x;
                const dy = targetCenter.y - currentCenter.y;

                let isDirectionMatch = false;
                if (e.key === 'ArrowRight' && dx > Math.abs(dy)) isDirectionMatch = true;
                if (e.key === 'ArrowLeft' && -dx > Math.abs(dy)) isDirectionMatch = true;
                if (e.key === 'ArrowDown' && dy > Math.abs(dx)) isDirectionMatch = true;
                if (e.key === 'ArrowUp' && -dy > Math.abs(dx)) isDirectionMatch = true;

                if (isDirectionMatch) {
                    const distance = Math.hypot(dx, dy);
                    if (target.dataset.section === currentSection) {
                        if (distance < shortestDistSame) { shortestDistSame = distance; bestMatchSame = target; }
                    } else {
                        if (distance < shortestDistOther) { shortestDistOther = distance; bestMatchOther = target; }
                    }
                }
            });

            let finalMatch = bestMatchSame;

            if (!finalMatch && bestMatchOther) {
                const targetSection = bestMatchOther.dataset.section;
                if (targetSection === 'left') finalMatch = document.getElementById('nav-home');
                else if (targetSection === 'right') finalMatch = document.getElementById('playPauseBtn');
                else if (targetSection === 'middle') {
                    if (currentSection === 'left') finalMatch = document.getElementById('first-home-card') || focusables.find((el) => el.classList.contains('card'));
                    else finalMatch = bestMatchOther;
                }
            }

            if (finalMatch) {
                finalMatch.focus();
                finalMatch.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'nearest' });
            }
        });

        window.onload = () => { if (window.innerWidth > 850) document.getElementById('nav-home').focus(); };
    </script>
</body>
</html>
